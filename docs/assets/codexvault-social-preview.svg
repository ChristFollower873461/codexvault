      <rect x="14" y="14" width="42" height="42" rx="10" fill="#edba69" fill-opacity="0.10"/>
      <text x="27" y="41" fill="#edba69" font-family="SFMono-Regular, Consolas, monospace" font-size="13" font-weight="800">CF</text>
      <text x="70" y="31" fill="#eef6f2" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700">Cloudflare · deploy</text>
      <text x="70" y="54" fill="#77877f" font-family="SFMono-Regular, Consolas, monospace" font-size="11">demo_cf_worker_••••••••••</text>
