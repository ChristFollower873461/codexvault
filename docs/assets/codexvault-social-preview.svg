  <circle cx="1120" cy="-25" r="315" fill="#42d99b" fill-opacity="0.055"/>
  <circle cx="1050" cy="40" r="190" fill="none" stroke="#7ff0c8" stroke-opacity="0.08" stroke-width="2"/>

  <g transform="translate(72 62)">
