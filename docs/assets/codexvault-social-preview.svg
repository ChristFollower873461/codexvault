      <text x="70" y="31" fill="#eef6f2" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700">OpenAI · primary</text>
      <text x="70" y="54" fill="#77877f" font-family="SFMono-Regular, Consolas, monospace" font-size="11">demo_openai_••••••••••••</text>
      <rect x="383" y="22" width="63" height="25" rx="12.5" fill="#42d99b" fill-opacity="0.12"/>
