      <path d="M19 26h28a9 9 0 0 1 9 9v13a9 9 0 0 1-9 9H19a9 9 0 0 1-9-9V35a9 9 0 0 1 9-9Z" fill="#10191f" stroke="url(#mint)" stroke-width="3"/>
      <circle cx="33" cy="41" r="7" fill="none" stroke="#ecf6f8" stroke-width="3"/>
      <path d="M33 41v8" stroke="#ecf6f8" stroke-linecap="round" stroke-width="3"/>
      <path d="M23 26v-2a10 10 0 0 1 20 0v2" fill="none" stroke="#8ba0ab" stroke-linecap="round" stroke-width="3"/>
