      <rect x="14" y="14" width="42" height="42" rx="10" fill="#ff8579" fill-opacity="0.09"/>
      <text x="27" y="41" fill="#ff9c92" font-family="SFMono-Regular, Consolas, monospace" font-size="13" font-weight="800">AN</text>
      <text x="70" y="31" fill="#eef6f2" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700">Anthropic · test</text>
      <text x="70" y="54" fill="#77877f" font-family="SFMono-Regular, Consolas, monospace" font-size="11">demo_anthropic_••••••••••</text>
      <rect x="376" y="22" width="70" height="25" rx="12.5" fill="#ff8579" fill-opacity="0.10"/>
      <text x="388" y="39" fill="#ff9c92" font-family="SFMono-Regular, Consolas, monospace" font-size="10" font-weight="700">REVOKED</text>
