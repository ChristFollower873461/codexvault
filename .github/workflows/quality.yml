name: Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend and browser boundary
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Run release-gate flows
        run: npm run test:release-gate
      - name: Build browser assets
        run: npm run build
      - name: Audit npm dependencies
        run: npm audit --audit-level=low

  rust:
    name: Rust vault and dependency audit
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
      - name: Install Rust 1.94.0
        run: |
          rustup toolchain install 1.94.0 --profile minimal
          rustup default 1.94.0
      - name: Test Rust vault core
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Install RustSec audit tool
        run: cargo install cargo-audit --locked --version 0.22.2
      - name: Audit Rust dependencies
        run: cargo audit --file src-tauri/Cargo.lock
